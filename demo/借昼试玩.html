<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f13">
  <title>借昼 · Borrowed Daylight</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0d13;
  --panel: #121822;
  --well: #0d121b;
  --line: #303b49;
  --light: #e8ece6;
  --soft: #aeb9ba;
  --dim: #8b999f;
  --green: #a6edb4;
  --amber: #ffc77c;
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 40% 0%, #202c32 0, #0e141d 41%, var(--bg) 88%);
  color: var(--light);
}
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
[hidden] { display: none !important; }
.shell {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 10px;
  height: 100vh;
  height: 100dvh;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.toolbar, .save-state, .light-state { display: flex; align-items: center; }
h2, p { margin: 0; }
.toolbar { flex: none; gap: 8px; }
.save-state { gap: 7px; font-size: 12px; color: var(--dim); margin-right: 8px; }
.save-state i, .light-state i, .map-title i { width: 6px; height: 6px; display: inline-block; background: var(--green); box-shadow: 0 0 8px #a6edb456; }
.small { padding: 8px 11px; border: 1px solid var(--line); color: var(--soft); background: #121922; font-size: 12px; }
.small:hover { color: var(--green); border-color: var(--green); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 23vw, 297px); grid-template-rows: minmax(0, 1fr); gap: 10px; }
.game-panel, .panel { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 14px 40px #05080965; }
.game-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.panel { min-width: 0; overflow: auto; overscroll-behavior: contain; }
.scene-header, .status-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 12px; }
.scene-header { padding-block: 5px; }
.scene-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; }
#location { color: var(--green); }
#day { color: var(--dim); }
.viewport { position: relative; background: #0b1118; overflow: hidden; border-block: 1px solid #2d414a; }
.viewport::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 3px,#070b1210 3px 4px); z-index: 1; }
canvas { display: block; width: 100%; image-rendering: pixelated; }
#world { position: absolute; inset: 0; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.screen-alert, .prompt, .dialogue { z-index: 2; position: absolute; }
.screen-alert, .prompt { pointer-events: none; }
.screen-alert { top: 12px; left: 50%; transform: translateX(-50%); max-width: 94%; text-align: center; padding: 6px 10px; border: 1px solid #a77a4d; background: #241a15ee; color: var(--amber); font-size: 12px; }
.prompt { bottom: 13px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #0b1119eb; border: 1px solid #5b8478; padding: 5px 10px 5px 5px; display: flex; gap: 8px; align-items: center; color: var(--green); font-size: 13px; }
.prompt kbd { color: #152820; background: var(--green); border-color: var(--green); }
.dialogue { left: 11px; bottom: 53px; width: min(325px, calc(100% - 22px)); background: #0c121ce9; border: 1px solid #60695d; padding: 10px 13px; font-size: 13px; box-shadow: 0 3px 0 #0005; pointer-events: none; }
.dialogue span { color: var(--amber); font-size: 11px; }
.dialogue p { margin-top: 4px; line-height: 1.6; }
.status-bar { justify-content: flex-start; flex-wrap: wrap; gap: 19px; }
.meter { display: grid; grid-template-columns: auto clamp(32px, 7vw, 100px) 25px; align-items: center; gap: 7px; color: var(--soft); }
.meter div { height: 6px; background: #242d36; }
.meter i { width: 100%; height: 100%; background: var(--green); display: block; }
.meter.amber i { background: var(--amber); }
.meter b { font-weight: 500; font-variant-numeric: tabular-nums; }
.light-state { margin-left: auto; font-size: 11px; color: var(--dim); gap: 7px; }
.light-state i.dark { background: #70808a; box-shadow: none; }
.mission, .map-card { padding: 16px; }
.folio { font-size: 11px; color: var(--green); letter-spacing: .10em; }
.objective { padding: 11px 11px 12px; background: var(--well); border-left: 2px solid var(--amber); }
.objective > span { font-size: 10px; color: var(--amber); }
.objective h2 { font-size: 15px; margin: 5px 0; line-height: 1.4; }
.objective p, .map-card p, .field-note { font-size: 12px; color: var(--soft); line-height: 1.7; }
.mission-data { display: flex; gap: 11px; justify-content: space-between; margin-top: 14px; font-size: 11px; color: var(--dim); }
.mission-data b { font-size: 12px; font-weight: 550; color: var(--light); }
.map-card { border-top: 1px solid var(--line); }
.map-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.map-title h2 { font-size: 13px; }
.map-title span { font-size: 10px; color: var(--dim); }
.map-title i { margin-right: 5px; }
.map-card canvas { background: var(--well); border: 1px solid #27333d; }
.map-card p { margin-top: 8px; min-height: 38px; }
.field-note { padding: 11px 16px; border-top: 1px solid var(--line); color: var(--dim); }
.footer { padding-inline: 1px; font-size: 12px; color: var(--dim); }
.keyboard-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 9px 19px; }
.gesture-note { display: none; color: var(--soft); line-height: 1.55; }
kbd { font: inherit; font-size: 11px; display: inline-block; min-width: 19px; text-align: center; color: var(--soft); border: 1px solid #3a4552; background: #151c27; padding: 2px 4px; margin-right: 2px; }
dialog { max-width: min(560px, calc(100vw - 24px)); width: 100%; padding: 0; color: var(--light); border: 1px solid #587167; background: var(--panel); box-shadow: 0 25px 70px #000a; max-height: calc(100dvh - 22px); }
dialog::backdrop { background: #080f17a9; backdrop-filter: blur(3px); }
#story { inset: auto 0 max(10px, env(safe-area-inset-bottom)); margin: 0 auto; max-width: min(520px, calc(100vw - 20px)); background: #111922f6; border-top: 2px solid var(--green); }
#story::backdrop { background: #05091042; backdrop-filter: none; }
.story-inner { padding: 13px 16px 12px; }
.story-inner h2 { margin: 4px 0 8px; font-size: 20px; }
.story-line { color: var(--light); font-size: 13px; line-height: 1.6; }
#story-speaker { color: var(--amber); font-size: 11px; }
#story-speaker:empty { display: none; }
.story-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
#story-next { color: #13241d; background: var(--green); border-color: var(--green); }
.dialog-inner { padding: 23px; }
.dialog-inner h2 { margin: 7px 0 9px; font-size: 24px; }
.dialog-inner > p:not(.folio) { color: var(--soft); line-height: 1.65; font-size: 13px; white-space: pre-line; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.actions button { background: var(--well); padding: 10px 12px; color: var(--light); text-align: left; border: 1px solid #40534e; font-size: 13px; }
.actions button:first-child { border-color: #8dcc9f; }
.actions button:hover:not(:disabled) { background: #20312d; color: var(--green); }
.actions button:disabled { color: var(--dim); cursor: default; }
.actions small { display: block; font-size: 11px; color: var(--dim); line-height: 1.5; margin-top: 4px; }
.rally-meter { position: relative; height: 11px; margin-top: 17px; background: #28343f; }
.rally-meter i { position: absolute; inset: 0 auto 0 58%; width: 19%; background: #76ae86; }
.rally-meter b { position: absolute; top: -2px; bottom: -2px; left: 0; width: 3px; background: var(--amber); }
@media (max-width: 860px) {
  .save-state { display: none; }
  .mission, .map-card { padding: 12px; }
}
@media (max-width: 700px), (max-height: 540px) {
  .shell {
    gap: 5px;
    padding: max(5px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  }
  .layout { gap: 5px; }
  .scene-header, .status-bar { padding: 5px 8px; gap: 8px; }
  .scene-header { font-size: 10px; }
  .toolbar { gap: 5px; }
  .small { min-height: 32px; padding: 4px 7px; }
  .status-bar { font-size: 11px; }
  .meter { grid-template-columns: auto clamp(30px, 7vw, 74px) 3ch; gap: 4px; }
  .field-note { display: none; }
  .mission, .map-card { padding: 7px 8px; }
  .objective { padding: 3px 7px; }
  .objective h2 { margin: 2px 0; font-size: 13px; }
  .objective p, .map-card p { font-size: 11px; line-height: 1.45; }
  .mission-data { margin-top: 5px; }
  .map-title { margin-bottom: 5px; }
  .map-card p { min-height: 0; margin-top: 5px; }
  .dialogue { bottom: 33px; padding: 5px 8px; font-size: 11px; max-width: 76%; }
  .prompt { bottom: 4px; font-size: 11px; padding-block: 2px; }
  .screen-alert { top: 5px; font-size: 10px; padding: 3px 5px; }
  .footer { font-size: 10px; }
}
@media (max-width: 700px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .map-card { display: none; }
}
@media (orientation: landscape) and (max-height: 540px) {
  .layout { grid-template-columns: minmax(0, 1fr) clamp(155px, 25vw, 230px); grid-template-rows: minmax(0, 1fr); }
  .map-card { display: block; }
  .story-inner { padding: 8px 12px; }
  .story-inner h2 { margin-block: 2px 4px; font-size: 16px; }
  .story-actions { margin-top: 5px; }
}
@media (orientation: landscape) and (max-height: 360px) {
  .scene-header, .status-bar, .map-card { padding-block: 3px; }
  .map-card canvas { width: min(100%, 120px); margin-inline: auto; }
}
@media (hover: none) and (pointer: coarse) {
  .keyboard-hint, .keyboard-controls { display: none; }
  .gesture-note { display: block; }
}
</style>

        <span><kbd>Space</kbd> 小队</span><span>武器自动攻击</span>

      <p id="gesture-note" class="gesture-note">拖动画面移动，拖远可冲刺。点按近处标记交互，长按打开小队。</p>
    </footer>
  </main>
  <dialog id="story" aria-labelledby="story-title">
    <div class="story-inner">
      <p id="story-place" class="folio"></p>
      <h2 id="story-title"></h2>
      <div class="story-line" aria-live="polite"><span id="story-speaker"></span><p id="story-text"></p></div>
      <div class="story-actions">
        <button type="button" id="story-skip" class="small">跳过过场</button>
        <button type="button" id="story-next" class="small" autofocus>继续</button>
      </div>
    </div>
  </dialog>
  <dialog id="menu" aria-labelledby="modal-title">
    <div class="dialog-inner">
      <p class="folio" id="modal-label"></p>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="rally-meter" class="rally-meter" hidden aria-hidden="true"><i></i><b></b></div>
      <div id="modal-actions" class="actions"></div>

"use strict";

const art = (() => {
  const colors = {
    black: "#111725", road: ["#343e45", "#354147", "#354149", "#313d45"],
    floor: ["#29343f", "#2c3842", "#303a43"], mud: ["#383b3b", "#393d3e", "#353b3d"],

    ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
  }
  function rand(x, y, i = 0) {
    let value = Math.imul(x + i * 313, 1597334677) ^ Math.imul(y + 31, 3812015801);
    value = Math.imul(value ^ value >>> 16, 2246822519);
    return ((value ^ value >>> 13) >>> 0) / 4294967296;
  }
  function roadAt(map, x, y) {
    return map.areas.some(([l,t,r,b]) => x >= l && x < r && y >= t && y < b);
  }
  function pathLine(ctx, x1, y1, x2, y2, color, width = 1) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }
  function tree(ctx, x, y, n) {
    box(ctx,x+3,y+12,12,4,"#111a22");
    box(ctx,x+7,y+9,3,8,"#424344");
    box(ctx,x+4,y+1,10,12,"#202f31");
    box(ctx,x+2,y+5,14,7,"#263836");
    box(ctx,x+5,y+3,7,5,n > .6 ? "#35483d" : "#2b3b38");
    box(ctx,x+8,y+2,3,9,"#394b40");
    box(ctx,x+1,y+10,4,2,"#202c2e");
  }
  function crate(ctx, x, y, type = 0, scale = 1) {
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(scale,scale);
    box(ctx,-7,3,15,5,"#111821");
    box(ctx,-7,-5,14,10,type ? "#53715a" : "#956f49");
    box(ctx,-7,-7,14,3,type ? "#729366" : "#bf9266");
    box(ctx,-7,3,14,2,"#392f2c");
    box(ctx,-5,-6,2,10,"#c5ad79"); box(ctx,3,-6,2,10,"#665137");
    if (type) { box(ctx,-2,-8,4,3,"#a4ca86"); box(ctx,-1,-10,2,3,"#537f53"); }
    ctx.restore();
  }
  function building(ctx, [tx,ty,tw,th,kind]) {
    const x=tx*TILE, y=ty*TILE, w=tw*TILE, h=th*TILE;
    const hospital=kind==="hospital", station=kind==="station", power=kind==="power";
    const glass=kind==="greenhouse", ruined=kind==="ruin";
    const cap=glass?"#4f7065":hospital?"#495359":station?"#3d5659":power?"#414852":"#333d47";
    box(ctx,x+5,y+6,w+5,h+5,"#101923");
    box(ctx,x,y,w,h,"#27333e");
    box(ctx,x,y,w,h-18,cap);
    box(ctx,x+4,y+5,w-8,h-27,"#293a42");
    if (glass) {
      box(ctx,x+5,y+6,w-10,h-31,"#395a51");
      for(let dx=10;dx<w-8;dx+=9) box(ctx,x+dx,y+7,2,h-32,"#638278");
    } else {
      for(let dx=9;dx<w-13;dx+=13){
        box(ctx,x+dx,y+8,2,h-34,"#354750");
        if(rand(tx+dx,ty)>.52)box(ctx,x+dx+3,y+11,6,4,"#293940");
      }
    }
    box(ctx,x,y+h-21,w,4,station?"#75948a":hospital?"#80786c":"#59616c");
    box(ctx,x+2,y+h-16,w-4,16,ruined?"#293039":"#384651");
    box(ctx,x+3,y+h-15,w-6,2,"#4a5761");
    for(let wx=x+8;wx<x+w-12;wx+=18){
      const lit=rand(wx, ty,1)>(ruined?.88:.42);
      box(ctx,wx,y+h-11,11,8,"#17232b");
      box(ctx,wx+2,y+h-9,7,4,lit?(station?"#79a389":"#b38c55"):"#333e49");
      if(lit) box(ctx,wx+3,y+h-9,1,4,"#d4bd7b");
    }
    if (hospital || station || power) {
      const dx=Math.floor(x+w/2)-11;
      box(ctx,dx,y+h-19,22,20,"#18262e");
      box(ctx,dx+3,y+h-17,16,4,hospital?"#b57a60":"#9ab69a");
      box(ctx,dx+4,y+h-10,14,9,"#304451");
      box(ctx,dx+10,y+h-10,2,9,"#19222b");
      if(hospital){box(ctx,x+w/2-15,y+14,30,22,"#3c4850");box(ctx,x+w/2-3,y+17,6,16,"#c78471");box(ctx,x+w/2-8,y+22,16,6,"#c78471");}
      if(power){box(ctx,x+w/2-9,y+17,18,18,"#242d36");box(ctx,x+w/2-2,y+19,4,12,"#c1a166");box(ctx,x+w/2-5,y+23,9,4,"#e7bf70");}
    }
    if(ruined){for(let j=0;j<9;j++){const xx=x+6+rand(tx+j,ty)*Math.max(6,w-12), yy=y+8+rand(tx,ty+j)*Math.max(5,h-31);box(ctx,xx,yy,4+(j%3)*3,3,"#1c2831");}}
  }
  function terrain(map, chapter) {
    const bg=document.createElement("canvas"); bg.width=WIDTH*TILE;bg.height=HEIGHT*TILE;
    const ctx=bg.getContext("2d");
    for(let y=0;y<HEIGHT;y++) for(let x=0;x<WIDTH;x++){
      const px=x*TILE, py=y*TILE, noise=rand(x,y);
      const water=chapter===2 && x>=27 && x<=51 && y>=11 && y<=18 && !roadAt(map,x+.5,y+.5);
      const onRoad=roadAt(map,x+.5,y+.5);
      const set=onRoad?(y>=18 && x>18 && x<45?colors.mud:colors.road):colors.earth;
      box(ctx,px,py,16,16,water?(noise>.53?"#223d45":"#233843"):set[Math.floor(noise*set.length)]);
      if(water){
        box(ctx,px+rand(x,y,3)*10,py+4,5,1,"#355561");
        box(ctx,px+5,py+12,8,1,"#2c4a54");
      } else {
        for(let i=0;i<5;i++){
          const shade=onRoad?(i<2?"#424d52":"#2e3a42"):(i<2?"#2c3838":"#141f28");
          box(ctx,px+rand(x,y,i+13)*14,py+rand(y,x,i+7)*14,1+(i%2),1,shade);
        }
        if(onRoad && !roadAt(map,x+.5,y-.5))box(ctx,px,py,16,2,"#52605d");
        if(onRoad && !roadAt(map,x+.5,y+1.5))box(ctx,px,py+14,16,2,"#25353e");
        if(onRoad && noise>.83){box(ctx,px+4,py+5,5,1,"#242e37");box(ctx,px+8,py+6,1,3,"#242e37");}
        if(!onRoad && noise>.92){box(ctx,px+5,py+9,7,2,"#475043");box(ctx,px+7,py+6,2,5,"#536051");}
      }
    }
    for(let x=3;x<65;x++) {
      if(x%3===0){box(ctx,x*16,15*16,10,2,"#77765d"); if(x>=19&&x<46)box(ctx,x*16,8.7*16,9,1,"#9b8a67");}
      if(x>=19&&x<45) {
        box(ctx,x*16,18.3*16,16,1,"#526653");
        box(ctx,x*16,21.75*16,16,1,"#536259");
      }
    }
    if(chapter===1) {
      for(let x=49;x<64;x++){
        box(ctx,x*16,11.1*16,16,1,"#93886a");box(ctx,x*16,16.9*16,16,1,"#93886a");
        box(ctx,x*16,11.7*16,16,4,"#282b39");box(ctx,x*16,16.2*16,16,4,"#282b39");
        box(ctx,x*16+5,11.3*16,3,10,"#5c4b46");box(ctx,x*16+5,15.9*16,3,10,"#5c4b46");
      }
      for(let x=53;x<=58;x+=2){box(ctx,x*16,20*16,20,11,"#526551");box(ctx,x*16+1,20*16+3,18,5,"#7f9061");}
    } else {
      for(let x=45;x<64;x++){
        for(const y of [8.5,11.8,16.4,20.2]) {
          box(ctx,x*16,y*16,16,2,"#829094");
          box(ctx,x*16,y*16+3,4,4,"#455765");
        }
      }
    }
    for(const b of map.buildings) building(ctx,b);
    for(let x=1;x<WIDTH-1;x++) for(let y=1;y<HEIGHT-1;y++){
      if(rand(x,y,6)<.925 || roadAt(map,x+.5,y+.5) || map.buildings.some(([a,b,w,h])=>x>=a-1&&x<=a+w&&y>=b-1&&y<=b+h))continue;
      tree(ctx,x*TILE,y*TILE,rand(x,y,7));
    }
    for(const [x,y,variant] of [[15,16,0],[17,12,0],[22,10,0],[40,20,0],[48,12,0],[57,18,1],[10,16,1],[53,10,0]]) crate(ctx,x*TILE,y*TILE,variant);
    return bg;
  }
  function person(ctx,x,y,look,step=0,flip=1) {
    ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(flip,1);
    box(ctx,-8,3,16,4,"#141d28");
    box(ctx,-5,-1+step,4,6,"#19232d");box(ctx,1,-1-step,4,6,"#19232d");
    box(ctx,-5,2+step,4,2,"#687473");box(ctx,1,2-step,4,2,"#687473");
    box(ctx,-7,-7,14,8,"#15222b");box(ctx,-5,-7,10,8,look.coat);box(ctx,-6,-5,3,6,look.trim);
    box(ctx,4,-5,3,6,look.coat);box(ctx,5,-2,2,2,look.skin);
    box(ctx,-5,-17,10,11,"#1a2229");box(ctx,-4,-15,8,8,look.skin);
    box(ctx,-5,-17,10,4,look.hair);box(ctx,-5,-14,2,4,look.hair);
    box(ctx,1,-12,1,2,"#303646");box(ctx,4,-13,1,2,"#303646");
    box(ctx,-3,-5,3,3,look.trim);ctx.restore();
  }
  const looks={
    player:{coat:"#cd864e",trim:"#e4c077",skin:"#d3a482",hair:"#524744"},
    sister:{coat:"#808e75",trim:"#b5ad79",skin:"#d2a08f",hair:"#5c4746"},
    engineer:{coat:"#567b88",trim:"#86bbb0",skin:"#b38d72",hair:"#425562"},
    child:{coat:"#9e8c61",trim:"#dbbd6c",skin:"#d1a181",hair:"#443b3f"},
    grower:{coat:"#68805c",trim:"#bfab69",skin:"#d5a77c",hair:"#574a46"}
  };
  function robot(ctx,e,t){
    const x=e.x*TILE,y=e.y*TILE;
    const boss=e.kind==="station"||e.kind==="bridge";
    ctx.save();ctx.translate(Math.round(x),Math.round(y));if(boss)ctx.scale(2.4,2.4);
    const anim=Math.floor(t*6)%2;
    const color=e.kind==="thief"?"#b18f67":e.kind==="jammer"?"#977b9d":"#8b9ba4";
    box(ctx,-10,2,20,5,"#15202a");
    box(ctx,-10,-4,5,9,"#283138");box(ctx,5,-4,5,9,"#283138");
    box(ctx,-10,-3+anim,5,2,"#52616a");box(ctx,5,-3+anim,5,2,"#52616a");
    box(ctx,-7,-11,14,13,"#344550");box(ctx,-6,-10,12,8,color);
    box(ctx,-6,-9,11,2,"#bac3bc");box(ctx,-5,-6,10,4,"#292d38");
    box(ctx,-2,-5,4,2,e.hurt>0?"#fff3c2":boss?"#efbf66":"#e28c79");
    if(e.kind==="thief"){box(ctx,-9,-8,3,5,"#d6ad7f");box(ctx,6,-8,3,5,"#d6ad7f");}
    if(e.kind==="jammer"){box(ctx,1,-15,1,5,"#c8a4ce");box(ctx,0,-16,3,2,"#c8a4ce");}
    if(boss){box(ctx,-10,-14,20,3,"#4e6769");box(ctx,-8,-14,3,2,"#e4b86b");box(ctx,5,-14,3,2,"#e4b86b");}
    ctx.restore();
  }
  function glow(ctx,x,y,r,tint){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,tint+"70");g.addColorStop(.45,tint+"24");g.addColorStop(1,tint+"00");
    ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  return {box,pathLine,terrain,person,robot,crate,glow,looks,roadAt};
})();
</script>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("world");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const mapCanvas = $("map");
const mini = mapCanvas.getContext("2d");
const menu = $("menu");
const storyDialog = $("story");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const backgrounds = MAPS.map((map, i) => art.terrain(map, i + 1));
const keys = new Set();
const touchInput = {pointer: null, startX: 0, startY: 0, x: 0, y: 0, moved: false, sprint: false, timer: 0};
const saveKey = "jiezhou-demo-v1";
const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const at = pair => ({x: pair[0], y: pair[1]});
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const safe = (fn, otherwise) => { try { return fn(); } catch { return otherwise; } };

function opening() {
  return {
    ch: 1, phase: "hospital", x: 5, y: 14.5, hp: 100, stamina: 100, scrap: 0,
    flags: {}, carry: "", held: [], drop: null, racked: [], final: [],
    quality: [3, 3], towers: {}, specialty: "", allocation: "", shore: "", crew: "follow"
  };
}
function load() {
  const saved = safe(() => JSON.parse(localStorage.getItem(saveKey)), null);
  const goals = saved?.ch === 1 ? CH1_GOALS : CH2_GOALS;
  if (!saved || ![1,2].includes(saved.ch) || !Object.hasOwn(goals, saved.phase)) return opening();
  return {...opening(), ...saved};
}
let state = load();
let checkpoint;
let runtime;
let audioOn = false;
let soundContext;
let dialogueUntil = 0;
let now = 0;
let last = performance.now();
let uiTime = 0;
let rally = null;
let story = null;
const currentMap = () => MAPS[state.ch - 1];
const point = name => at(currentMap().points[name === "stock" ? stockPoint() : name]);
const stockPoint = () => state.allocation === "borrow" ? "stockB" : state.allocation === "mirror" && state.flags.mirror ? "stockC" : "stockA";
const totalBoxes = () => state.phase === "bridgeBoss" ? state.final.length : state.racked.length;

function save(message = "进度已保存") {
  checkpoint = JSON.stringify(state);
  const stored = safe(() => {localStorage.setItem(saveKey, checkpoint); return true;}, false);
  $("save-label").textContent = stored ? message : "本次会话存档";
}
function put(name) {
  Object.assign(state, point(name));
}
function say(speaker, speech, seconds = 5) {
  $("speaker").textContent = speaker;
  $("speech").textContent = speech;
  $("dialogue").hidden = false;
  dialogueUntil = now + seconds;
}
function beep(freq, duration = .09, type = "triangle", volume = .055) {
  if (!audioOn || !soundContext) return;
  const start = soundContext.currentTime;
  const osc = soundContext.createOscillator();
  const gain = soundContext.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq,start);
  osc.frequency.exponentialRampToValueAtTime(freq * .78, start+duration);
  gain.gain.setValueAtTime(volume,start);
  gain.gain.exponentialRampToValueAtTime(.001,start+duration);
  osc.connect(gain);gain.connect(soundContext.destination);
  osc.start(start);osc.stop(start+duration);
}
function cameraTarget(focus = state, scale = 1) {
  const width = canvas.width / scale, height = canvas.height / scale;
  return {
    cameraX: clamp(focus.x * TILE - width / 2, 0, WIDTH * TILE - width),
    cameraY: clamp(focus.y * TILE - height / 2, 0, HEIGHT * TILE - height)
  };
}
function newRuntime() {
  runtime = {
    enemies: [], spawn: 0, marks: {}, boss: null, bossTime: 0, bossSpawn: 0,
    effects: [], elapsed: 0, cooldown: 0, invuln: 0, lastSprint: -10, xp: 0, upgrade: "",
    wave: 0, waveGap: 0, cabinet: 70, disabled: 0, towerShots: {}, countdown: 0,
    walking: false, flip: 1, npcX: state.x - .8, npcY: state.y + .5, guard: null,
    ...cameraTarget()

  if (state.phase === "stationBoss") setupBoss("station");
  if (state.phase === "bridgeBoss") setupBoss("bridge");
  if (state.phase === "defenseWave") spawnWave(1);
}
function setPhase(phase, store = true) {
  state.phase = phase;
  if (store) save();
  syncHud();
}
function setupBoss(kind) {
  const x = kind === "station" ? 57.5 : 58.5;
  runtime.boss = {kind,x,y:14.2,hp:kind === "station" ? 105 : 132, max:kind === "station" ? 105 : 132,hurt:0};
  runtime.bossTime = 0; runtime.bossSpawn = 0;
  runtime.enemies = [];
}
function beginBoss(kind) {
  setupBoss(kind);
  state.hp = 100;
  state.stamina = 100;
  setPhase(kind === "station" ? "stationBoss" : "bridgeBoss");
  if(kind === "station") playStory("machine");
  else say("梁砚","先在接应架取苗。摊铺车抬臂时，另一侧能过。",6);
  beep(95,.25);
}
function resetFromCheckpoint() {
  closeMenu();
  state = JSON.parse(checkpoint);
  state.hp = 100; state.stamina = 100;
  newRuntime(); save();
  say("巡线员","已从最近的安全点重新出发。",4);

}
function openMenu(label, title, copy, options) {
  clearControls();
  $("rally-meter").hidden = true;
  $("modal-label").textContent = label;
  $("modal-title").textContent = title;
  $("modal-text").textContent = copy;
  const actions = $("modal-actions");
  actions.replaceChildren();
  for(const option of options) {
    const button = document.createElement("button");
    button.type = "button";
    button.disabled = option.disabled === true;
    button.append(document.createTextNode(option.title));
    if(option.note){
      const note=document.createElement("small");
      note.textContent=option.note;button.append(note);
    }
    button.addEventListener("click", () => {closeMenu(); option.run?.(); syncHud();});
    actions.append(button);
  }
  if(!menu.open) menu.showModal();
  actions.querySelector("button:not(:disabled)")?.focus();
}
function closeMenu() { if(menu.open) menu.close(); clearControls(); rally=null; $("rally-meter").hidden=true; }
const returnChoice = {title:"返回现场"};

function showStoryBeat() {
  const beat = story.scene.beats[story.index];
  story.focus = point(beat.focus);
  story.from = beat.from ? point(beat.from) : null;
  story.effect = beat.effect;
  story.started = now;
  $("story-speaker").textContent = beat.speaker;
  $("story-text").textContent = beat.text;
  $("story-next").textContent = story.index + 1 === story.scene.beats.length ? "返回现场" : "继续";
}
function playStory(id, after) {
  clearControls();
  runtime.walking = false;
  $("dialogue").hidden = true;
  const scene = STATION_STORY[id];
  story = {id, scene, index: 0, after};

  $("story-title").textContent = scene.title;
  showStoryBeat();
  storyDialog.showModal();
}
function endStory() {
  if (!story) return;
  const {after} = story;

  storyDialog.close();

}

function takeCargo(mode, ids) {
  if(!ids.length) return;
  state.carry = mode;
  state.held = mode === "hand" ? ids.slice(0,1) : ids;
  if(state.drop && ids === state.drop.ids) {
    const left=state.drop.ids.filter(id=>!state.held.includes(id));
    state.drop=left.length?{...state.drop,ids:left}:null;
  }
  if(state.phase==="collect"){
    setPhase("transport");
    if(state.ch===1)playStory("delivery");
  } else save();
  beep(340);
}
function stockOptions(ids) {
  const battery = state.ch===1;
  openMenu("货物","选择搬运方式",battery
    ? "这一组电池可用推车走灯廊，也可手提走泵房便道。"

    {title:"牵引推车",note:"通行宽路，移动较慢。",run:()=>takeCargo("cart",ids)},

    returnChoice

function putCargoDown() {
  if(!state.held.length)return;
  if(state.drop) {
    say("巡线员","先把手里的货交到接应架，再回来取停放的货。",4);
    return;
  }
  state.drop={x:state.x,y:state.y,ids:state.held,mode:state.carry};
  state.held=[];state.carry="";save();beep(180);
}
function splitCargo() {
  if(state.carry!=="cart")return;
  if(state.held.length>1 && state.drop){say("巡线员","前面已经停了一箱。先在接应架交货。");return;}
  if(state.held.length>1)state.drop={x:state.x,y:state.y,ids:state.held.slice(1),mode:"hand"};
  state.held=state.held.slice(0,1);state.carry="hand";save();
  say("巡线员","换成手提。推车留在入口。",3);

function available() {
  const consumed = state.phase==="bridgeBoss"?state.final:state.racked;
  const omit=new Set([...consumed,...state.held,...(state.drop?.ids||[])]);
  return (state.ch===1?[0]:[0,1]).filter(id=>!omit.has(id));

function deposit(where) {
  if(!state.held.length){say("巡线员","接应架空着。先把货带过来。",3);return;}
  if(where==="rack"){
    state.racked=[...new Set([...state.racked,...state.held])];
    state.held=[];state.carry="";beep(520);
    if(state.racked.length===2){
      state.scrap+=2;runtime.xp=0;runtime.upgrade="";runtime.enemies=[];
      setPhase("defensePrep");

  } else {
    state.final=[...new Set([...state.final,...state.held])];
    state.held=[];state.carry="";beep(540);
    if(state.final.length===2){runtime.enemies=[];runtime.boss=null;setPhase("power");say("叶禾","两箱都好好的。现在能给它们找个地方长了。");}

function updateMovement(dt){
  const keyX=Number(keys.has("KeyD")||keys.has("ArrowRight"))-Number(keys.has("KeyA")||keys.has("ArrowLeft"));
  const keyY=Number(keys.has("KeyS")||keys.has("ArrowDown"))-Number(keys.has("KeyW")||keys.has("ArrowUp"));
  const keyLength=Math.hypot(keyX,keyY);
  const dx=keyLength?keyX/keyLength:touchInput.x;
  const dy=keyLength?keyY/keyLength:touchInput.y;
  const strength=keyLength?1:Math.hypot(dx,dy);
  runtime.walking=strength>0;
  if(dx)runtime.flip=Math.sign(dx);
  let speed=state.carry==="cart"?2.8+(state.specialty==="transport"?.2:0):state.carry==="hand"?3.4:4;
  const sprinting=touchInput.sprint||keys.has("ShiftLeft")||keys.has("ShiftRight");
  if(strength&&!state.carry&&sprinting&&state.stamina>0){
    speed=5.6;state.stamina=Math.max(0,state.stamina-10*dt*strength);runtime.lastSprint=runtime.elapsed;
  }
  if(strength){
    const nx=state.x+dx*speed*dt;
    const ny=state.y+dy*speed*dt;
    if(passable(nx,state.y))state.x=nx;
    if(passable(state.x,ny))state.y=ny;
  }
  if(runtime.elapsed-runtime.lastSprint>1&&isLit())state.stamina=Math.min(100,state.stamina+8*dt);
  let companion=state.crew==="hold"&&runtime.guard?runtime.guard:
    {x:state.x-.78*runtime.flip,y:state.y+.67};
  const distanceTo=distance(companion,{x:runtime.npcX,y:runtime.npcY});
  const speedNpc=distanceTo>6?7:4;
  const factor=Math.min(1,speedNpc*dt/Math.max(.001,distanceTo));
  runtime.npcX+=(companion.x-runtime.npcX)*factor;
  runtime.npcY+=(companion.y-runtime.npcY)*factor;
}
function passable(x,y){
  if(!art.roadAt(currentMap(),x,y))return false;
  if(state.carry==="cart"&&x>=20&&x<43&&y>=18)return false;
  if(state.ch===1&&x>=36&&x<37&&y>=18&&y<22&&!state.flags.gate)return false;
  if(state.ch===1&&x>53&&!["inspection","stationBoss","audit","power","complete"].includes(state.phase))return false;
  if(state.ch===1&&state.phase==="inspection"&&x>=56)return false;
  if(state.ch===1&&state.phase==="stationBoss"&&runtime.boss&&!bossExposed()&&!state.flags.lever&&x>=55.7&&x<56.4&&y>11.8&&y<16.1)return false;
  if(state.ch===2&&["collect","transport","defensePrep","defenseWave"].includes(state.phase)&&x>53.8)return false;
  return true;
}

function updateBoss(dt){
  if(!runtime.boss)return;
  const e=runtime.boss;
  runtime.bossTime+=dt;e.hurt=Math.max(0,e.hurt-dt);
  const cycle=runtime.bossTime%7;
  let aim=bossLane();
  if(e.kind==="station")aim=14.2+(Math.floor(runtime.bossTime/7)%2===0?-1:1);
  e.y+=(aim-e.y)*Math.min(1,dt*(cycle<4.4?2.4:1));
  if(cycle>=3.4&&cycle<4.4){
    const hit=e.kind==="bridge"
      ?state.x>54&&Math.abs(state.y-bossLane())<.93
      :state.x>53&&state.x<61&&Math.abs(state.y-e.y)<.96;
    if(hit)hitPlayer(e.kind==="bridge"?16:13);
  }
  const cycleIndex=Math.floor(runtime.bossTime/7);
  if(cycleIndex>runtime.bossSpawn&&runtime.enemies.length<3){
    runtime.bossSpawn=cycleIndex;

function updateEnemies(dt) {
  const defend=state.phase==="defenseWave";
  const manager=defend?point("console"):null;
  for(const e of runtime.enemies){
    e.hurt=Math.max(0,e.hurt-dt);e.cd=Math.max(0,e.cd-dt);
    const targetsCrate=e.kind==="thief"&&state.held.length>0;
    const target=defend&&manager?manager:targetsCrate?state.drop||state:state;
    const dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy);
    const slowed=runtime.disabled<=0&&Object.entries(state.towers).some(([key,value])=>value.kind==="slow"&&distance(e,point(key))<2.65);
    if(d>1.02 && e.ready<=0){
      const speed=ENEMIES[e.kind].speed*(slowed?.65:1);
      e.x+=dx/d*speed*dt;e.y+=dy/d*speed*dt;
    } else if(e.cd<=0){
      e.ready+=dt;
      const wind=e.kind==="jammer"?2:e.kind==="thief"?1.04:.8;
      if(e.ready>=wind){
        e.ready=0;e.cd=e.kind==="jammer"?6:1.55;
        if(distance(e,target)<1.68){
          if(defend) {
            if(e.kind==="jammer")runtime.disabled=3;
            runtime.cabinet=Math.max(0,runtime.cabinet-(e.kind==="jammer"?9:7));
          }
          else if(targetsCrate && state.ch===2){
            const id=state.held[0];
            state.quality[id]-=state.crew==="escort"?.5:1;
            if(state.quality[id]<=0){
              state.held=state.held.filter(box=>box!==id);

              state.quality[id]=3;

        }
      }
    }
  }

    openMenu("守线失败","控制柜断电","从布防前重试，接应架上的两箱幼苗会保留。",[
      {title:"重新布防",run:resetFromCheckpoint}
    ]);
  }
}

function updateAttacks(dt){
  runtime.cooldown=Math.max(0,runtime.cooldown-dt);
  const options=[...runtime.enemies];
  if(runtime.boss&&bossExposed()) options.push(runtime.boss);
  const range=runtime.upgrade==="range"?3.5:2.5;
  const near=options.filter(e=>e.hp>0&&distance(e,state)<=range).sort((a,b)=>distance(a,state)-distance(b,state))[0];
  if(near && runtime.cooldown<=0){
    runtime.cooldown=.65;
    shoot(state,near,10+(runtime.upgrade==="damage"?4:0)+(state.specialty==="combat"?1:0),"#e4c97b");
    beep(250,.04,"triangle",.019);
  }
  for(const [key,value] of Object.entries(state.towers)){
    runtime.towerShots[key]=(runtime.towerShots[key]||0)-dt;
    if(value.kind!=="gun" || runtime.disabled>0 || runtime.towerShots[key]>0)continue;
    const p=point(key);
    const target=options.filter(e=>e.hp>0&&distance(e,p)<4.6).sort((a,b)=>distance(a,p)-distance(b,p))[0];
    if(target){runtime.towerShots[key]=.8;shoot(p,target,8,"#a5dbc4");}
  }
  if(state.crew==="hold"&&runtime.guard&&Math.floor(runtime.elapsed)!==Math.floor(runtime.elapsed-dt)){
    const target=options.find(e=>e.hp>0&&distance(e,runtime.guard)<1.8);
    if(target)shoot(runtime.guard,target,6,"#84b8ad");
  }
  runtime.enemies=runtime.enemies.filter(e=>e.hp>0);
  runtime.effects=runtime.effects.map(e=>({...e,left:e.left-dt})).filter(e=>e.left>0);
  if(runtime.xp>=3&&!runtime.upgrade&&!menu.open&&["scout","transport","defenseWave"].includes(state.phase)&&state.hp>0)chooseUpgrade();
}
function advance(dt){
  if(menu.open||story)return;
  runtime.elapsed+=dt;
  runtime.invuln=Math.max(0,runtime.invuln-dt);
  runtime.disabled=Math.max(0,runtime.disabled-dt);
  updateMovement(dt);triggerPatrols();updateBoss(dt);updateEnemies(dt);
  if(menu.open)return;
  updateAttacks(dt);
  if(state.phase==="defensePrep"&&runtime.countdown>0){
    runtime.countdown-=dt;
    if(runtime.countdown<=0)startDefense();
  }
  if(state.phase==="defenseWave"&&runtime.enemies.length===0){
    runtime.waveGap+=dt;
    if(runtime.waveGap>2.4){
      if(runtime.wave===1)spawnWave(2);
      else beginBoss("bridge");
    }
  }
}

      art.pathLine(ctx,left,y-12,left+160,y-12,"#e7956c");art.pathLine(ctx,left,y+12,left+160,y+12,"#e7956c");
    }
    art.robot(ctx,runtime.boss,now);
    const {x,y,hp,max}=runtime.boss;
    art.box(ctx,x*TILE-25,y*TILE-47,50,4,"#17232b");art.box(ctx,x*TILE-25,y*TILE-47,50*hp/max,4,bossExposed()?"#a4e6a3":"#e98b69");
    if(bossExposed())art.glow(ctx,x*TILE,y*TILE-12,23,"#bddb92");
  }
  for(const e of runtime.enemies){
    if(e.ready>.2){
      const x=e.x*TILE,y=e.y*TILE;
      art.box(ctx,x-7,y-19,14,2,"#202631");
      art.box(ctx,x-7,y-19,Math.min(14,e.ready*12),2,"#e9a168");
    }
    art.robot(ctx,e,now);
  }
  for(const bolt of runtime.effects) {
    ctx.globalAlpha=bolt.left/.18;
    art.pathLine(ctx,bolt.from.x*TILE,bolt.from.y*TILE-7,bolt.to.x*TILE,bolt.to.y*TILE-5,bolt.tint,2);
    art.box(ctx,bolt.to.x*TILE-2,bolt.to.y*TILE-7,3,3,"#efe7ac");
    ctx.globalAlpha=1;
  }
}
function drawMap(){
  const w=mapCanvas.width,h=mapCanvas.height;
  mini.clearRect(0,0,w,h);
  const sx=w/WIDTH,sy=h/HEIGHT;
  mini.fillStyle="#101b25";mini.fillRect(0,0,w,h);
  for(const [x,y,r,b] of currentMap().areas){
    mini.fillStyle=y>=18&&x<45?"#354447":"#45575f";
    mini.fillRect(x*sx,y*sy,(r-x)*sx,(b-y)*sy);
  }
  if(state.ch===1&&state.flags.road)art.box(mini,35*sx,8*sy,6*sx,2*sy,"#9aca9f");
  for(const [x,y] of lamps())art.box(mini,x*sx-1.4,y*sy-1.4,3,3,"#c8a575");
  const goal=goalPoint();
  art.box(mini,goal.x*sx-2,goal.y*sy-2,5,5,"#f7bf78");
  art.box(mini,state.x*sx-2,state.y*sy-2,5,5,"#a6edb4");
}
function drawStoryLighting(elapsed) {
  const {focus, from} = story;
  const moving = !reducedMotion.matches;
  const x=focus.x*TILE,y=focus.y*TILE-8;
  const glow=moving?40+7*Math.sin(elapsed*2):40;
  if(from){
    const startX=from.x*TILE,startY=from.y*TILE-8;
    const charge=moving?clamp(elapsed/1.15,0,1):1;
    const endX=startX+(x-startX)*charge,endY=startY+(y-startY)*charge;
    art.pathLine(ctx,startX,startY,x,y,"#c2bc7d38",2);
    art.pathLine(ctx,startX,startY,endX,endY,"#c6e49caa",2);
    art.glow(ctx,endX,endY,18,"#d6f3a2");
    art.box(ctx,endX-2,endY-2,4,4,"#e2f7bc");
  }
  art.glow(ctx,x,y,glow,"#dbde9e");
}
function render(dt) {
  const elapsed=story?now-story.started:0;
  const scale=story&&!reducedMotion.matches?1.08+.18*clamp(elapsed/.9,0,1):1;
  const target=cameraTarget(story?.focus,scale);
  const follow=story&&reducedMotion.matches?1:Math.min(1,dt*(story?3.5:8));
  runtime.cameraX+=(target.cameraX-runtime.cameraX)*follow;
  runtime.cameraY+=(target.cameraY-runtime.cameraY)*follow;
  runtime.cameraX=Math.min(runtime.cameraX,WIDTH*TILE-canvas.width/scale);
  runtime.cameraY=Math.min(runtime.cameraY,HEIGHT*TILE-canvas.height/scale);
  const cx=Math.round(runtime.cameraX),cy=Math.round(runtime.cameraY);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(backgrounds[state.ch-1],cx,cy,canvas.width/scale,canvas.height/scale,0,0,canvas.width,canvas.height);
  ctx.save();ctx.scale(scale,scale);ctx.translate(-cx,-cy);
  drawProgress();drawLamps();drawGate();drawTargets();drawHostiles();
  if((state.flags.engineer||state.flags.tempEngineer)&&story?.id!=="residents")art.person(ctx,runtime.npcX*TILE,runtime.npcY*TILE,art.looks.engineer,runtime.walking?Math.floor(now*7)%2:0,runtime.flip);
  if(story)drawStoryLighting(elapsed);
  art.glow(ctx,state.x*TILE,state.y*TILE,35,"#b7bb83");
  ctx.globalAlpha=runtime.invuln>0&&Math.floor(now*10)%2===0?.53:1;
  art.person(ctx,state.x*TILE,state.y*TILE,art.looks.player,runtime.walking?Math.floor(now*10)%3-1:0,runtime.flip);
  ctx.globalAlpha=1;
  const active=story?null:nearest();
  if(!story)for(const p of interactables())if(distance(p,state)<15)markInteraction(p,active?.label===p.label&&active?.x===p.x&&active?.y===p.y);
  ctx.font='bold 9px ui-monospace, "PingFang SC", monospace';
  ctx.textAlign="center";
  for(const [x,y,name] of currentMap().labels) {
    const xx=x*TILE,yy=y*TILE;
    const width=ctx.measureText(name).width;
    art.box(ctx,xx-width/2-4,yy-8,width+8,12,"#182733ee");ctx.fillStyle="#d2ddd2";ctx.fillText(name,xx,yy+1);
  }
  ctx.restore();
  const centerX=canvas.width/2,centerY=canvas.height/2;
  const vignette=ctx.createRadialGradient(centerX,centerY,Math.min(centerX,centerY)*.78,centerX,centerY,Math.hypot(centerX,centerY));
  vignette.addColorStop(0,"#0b131900");vignette.addColorStop(1,"#06091180");
  ctx.fillStyle=vignette;ctx.fillRect(0,0,canvas.width,canvas.height);
  const prompt=$("prompt");
  const label=active?.label||(state.held.length?"停放货物":"");
  if(prompt.lastElementChild.textContent!==label)prompt.lastElementChild.textContent=label;
  prompt.hidden=!label||menu.open||!!story;
  if(now>dialogueUntil)$("dialogue").hidden=true;
  drawMap();
}
function getGoal(){return (state.ch===1?CH1_GOALS:CH2_GOALS)[state.phase];}
function goalPoint() {
  const goal=getGoal()[2];
  if(state.ch===1){
    if(state.phase==="routeSurvey"&&state.y>=16)return point("southMarker");
    if(["transport","stationBoss"].includes(state.phase)&&state.drop&&!state.held.length)return state.drop;
  }
  if(state.ch===2&&state.phase==="bridgeBoss"&&state.held.length===0)return point("reclaim");
  if(state.ch===2&&state.phase==="transport"&&!state.held.length&&available().length)return point("stock");
  return point(goal);
}
function syncHud() {
  const goal=getGoal();
  const target=goalPoint();
  if($("goal-title").textContent!==goal[0])$("goal-title").textContent=goal[0];
  $("goal-text").textContent=state.ch===1&&state.phase==="stationBoss"&&!state.held.length
    ?"在接应位取回电池，再趁广播停顿去轨道东端接线。"
    :state.ch===2&&state.phase==="bridgeBoss"&&state.held.length===0?"在桥头接应架取苗，再看预警挑路线。":goal[1];
  $("location").textContent=state.ch===1?(state.x<10?"平原 · 中心医院":state.x<19?"平原 · 配电站":state.x<45?"平原 · 站外街区":"平原 · 旧地铁站"):(state.x<19?"平原 · 驿站":state.x<45?"平原 · 洪沟":"平原 · 雨水高架");
  $("day").textContent=state.ch===1?"战后第十八年 · 夜":"战后第十八年 · 次日";
  $("freight").textContent=state.ch===1?(state.held.length?"电池 ×1":state.drop?"电池已停放":["audit","power","complete"].includes(state.phase)?"已接入":"—"):(state.held.length?("在途 "+state.held.length+"/2"):(totalBoxes()+"/2"));
  $("gesture-note").textContent=state.held.length
    ?"拖动画面移动，点按近处标记交互，点自己放下货物。"
    :"拖动画面移动，拖远可冲刺。点按近处标记交互，长按打开小队。";
  $("scrap").textContent=state.scrap;
  $("crew").textContent=1+(state.flags.engineer||state.flags.tempEngineer?1:0)+(state.flags.grower?1:0);
  $("hp").textContent=Math.ceil(state.hp);
  $("stamina").textContent=Math.ceil(state.stamina);
  $("hp-bar").style.width=state.hp+"%";
  $("stamina-bar").style.width=state.stamina+"%";
  $("light-dot").classList.toggle("dark",!isLit());
  $("light-label").textContent=isLit()?"固定照明":"暗区";
  $("route-hint").textContent=state.phase==="complete"?"工单已结算。":"目标约 "+Math.ceil(distance(state,target))+" 格 · 上方主路，下方泵房便道。";
  let alert="";
  if(runtime.countdown>0) alert="布防 "+Math.ceil(runtime.countdown)+" 秒 · 可通过控制柜提前开战";
  if(state.phase==="defenseWave")alert="第 "+runtime.wave+"/2 波 · 控制柜 "+runtime.cabinet+"/70"+(runtime.disabled>0?" · 设备受干扰":"");
  if(runtime.boss)alert=(state.ch===1?"空站验票机":"断桥摊铺车")+" · "+(bossExposed()?(state.ch===1?"广播「无人」，可接线":"通行窗口"):"留意橙色警示带");
  $("screen-alert").textContent=alert;$("screen-alert").hidden=!alert;
  $("field-note").textContent=state.held.length
    ?(state.carry==="cart"?"推车可走高架。在便道入口可卸箱手提。":"手提货可过便道。交货前留意抢货机。")
    :state.ch===2?"塔与路灯共享桥头供电。已建成的路会保留。":"固定照明能恢复体力。手提灯照亮脚下的路。";
}
function pause(){
  if(menu.open){closeMenu();return;}
  openMenu("暂停","出勤已暂停","触屏拖动移动，拖远冲刺，点按近处标记交互，长按打开小队。\n键盘可用 WASD、E、Shift 和空格。",[
    {title:"继续出勤"},
    {title:"从检查点重试",run:resetFromCheckpoint},
    {title:"重新开始",run:confirmReset}
  ]);
}
const movementKeys=["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","ShiftLeft","ShiftRight"];
window.addEventListener("keydown",event=>{
  if(story){
    if(event.code==="KeyE"&&!event.repeat){event.preventDefault();$("story-next").click();}
    return;
  }
  if(event.code==="Escape"&&!menu.open){event.preventDefault();pause();return;}
  if(menu.open&&rally&&event.code==="KeyE"&&!event.repeat){
    event.preventDefault();
    const score=rally.score;closeMenu();hitRally(score);return;
  }
  if(menu.open)return;
  if(movementKeys.includes(event.code)){event.preventDefault();keys.add(event.code);return;}
  if(event.repeat)return;
  if(event.code==="KeyE"){event.preventDefault();use();}
  if(event.code==="Space"){event.preventDefault();crewMenu();}
});
window.addEventListener("keyup",event=>keys.delete(event.code));
window.addEventListener("blur",clearControls);
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearControls();});
menu.addEventListener("cancel",event=>{event.preventDefault();closeMenu();});
storyDialog.addEventListener("cancel",event=>{event.preventDefault();endStory();});
$("story-skip").addEventListener("click",endStory);
$("story-next").addEventListener("click",()=>{
  if(!story)return;
  if(++story.index===story.scene.beats.length)endStory();
  else showStoryBeat();
});
$("pause").addEventListener("click",pause);
$("sound").addEventListener("click",async()=>{
  audioOn=!audioOn;
  if(audioOn){soundContext||=new AudioContext();await soundContext.resume();beep(560,.13);}
  $("sound").setAttribute("aria-pressed",String(audioOn));
  $("sound").textContent=audioOn?"声音开":"声音关";
});
function releaseCanvasTouch(){
  const id=touchInput.pointer;
  touchInput.pointer=null;
  touchInput.x=0;touchInput.y=0;
  touchInput.sprint=false;
  clearTimeout(touchInput.timer);
  if(id!==null&&canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);
}
function clearControls(){keys.clear();releaseCanvasTouch();}
function canvasTap(event){
  const bounds=canvas.getBoundingClientRect();
  const px=(event.clientX-bounds.left)*canvas.width/bounds.width;
  const py=(event.clientY-bounds.top)*canvas.height/bounds.height;
  if(px<0||px>=canvas.width||py<0||py>=canvas.height)return;
  const tap={x:(px+Math.round(runtime.cameraX))/TILE,y:(py+Math.round(runtime.cameraY))/TILE};
  const targets=interactables().filter(item=>Math.abs(item.x-tap.x)<.95&&tap.y>=item.y-1.85&&tap.y<=item.y+.6);
  const target=targets.sort((a,b)=>distance(a,state)-distance(b,state))[0];
  if(target){
    if(distance(target,state)<1.58)use(target);
    else say("提示","走近后点按目标。",2);
    return;
  }
  if(state.held.length&&distance(tap,{x:state.x,y:state.y-.5})<1)use(null);
}
canvas.addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse"||menu.open||story||touchInput.pointer!==null||event.button!==0)return;
  event.preventDefault();
  touchInput.pointer=event.pointerId;
  touchInput.startX=event.clientX;
  touchInput.startY=event.clientY;
  touchInput.moved=false;
  canvas.setPointerCapture(event.pointerId);
  if(state.flags.engineer||state.flags.tempEngineer){
    touchInput.timer=setTimeout(crewMenu,570);
  }
});
canvas.addEventListener("pointermove",event=>{
  if(event.pointerId!==touchInput.pointer)return;
  const x=event.clientX-touchInput.startX;
  const y=event.clientY-touchInput.startY;
  const length=Math.hypot(x,y);
  const deadZone=6;
  if(length>deadZone){
    touchInput.moved=true;
    clearTimeout(touchInput.timer);
  }
  const pull=clamp((length-deadZone)/22,0,1);
  touchInput.x=length===0?0:x/length*pull;
  touchInput.y=length===0?0:y/length*pull;
  touchInput.sprint=length>=52;
});
canvas.addEventListener("pointerup",event=>{
  if(event.pointerId!==touchInput.pointer)return;
  const tap=!touchInput.moved;
  releaseCanvasTouch();
  if(tap)canvasTap(event);
});
for(const eventName of ["pointercancel","lostpointercapture"]){
  canvas.addEventListener(eventName,event=>{if(event.pointerId===touchInput.pointer)releaseCanvasTouch();});
}
newRuntime();
save("本地存档");
syncHud();
showOpening();
const worldSize = new ResizeObserver(([entry]) => {
  const {width, height} = entry.contentRect;
  if (!width || !height) return;
  // Keep sprite sizes readable and the camera crop inside the terrain bitmap.
  const scale = Math.max(1.5, width / 640, height / 416);
  const viewWidth = Math.max(1, Math.round(width / scale));
  const viewHeight = Math.max(1, Math.round(height / scale));
  if (viewWidth === canvas.width && viewHeight === canvas.height) return;
  canvas.width = viewWidth;
  canvas.height = viewHeight;
  ctx.imageSmoothingEnabled = false;
  releaseCanvasTouch();
  Object.assign(runtime, cameraTarget());
  render(0);
});
worldSize.observe(canvas);
function frame(time){
  const dt=Math.min((time-last)/1000,.04);
  last=time;now+=dt;
  advance(dt);
  if(rally){
    lastRallyPosition=clamp((time-rally.start)/(1550-rally.score*95),0,1);
    $("rally-meter").lastElementChild.style.left=lastRallyPosition*100+"%";
    if(lastRallyPosition>=1){const score=rally.score;closeMenu();hitRally(score);}
  }
  render(dt);
  uiTime+=dt;
  if(uiTime>=.14){syncHud();uiTime=0;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
