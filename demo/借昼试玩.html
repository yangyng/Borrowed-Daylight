<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0f13">
  <title>借昼 · 第一至二章试玩</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0d13;
  --panel: #121822;
  --well: #0d121b;
  --line: #303b49;
  --light: #e8ece6;
  --soft: #aeb9ba;
  --dim: #8b999f;
  --green: #a6edb4;
  --amber: #ffc77c;
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 40% 0%, #202c32 0, #0e141d 41%, var(--bg) 88%);
  color: var(--light);
}
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
[hidden] { display: none !important; }
.shell { max-width: 1390px; margin: auto; padding: 30px 32px 23px; }
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.identity, .toolbar, .save-state, .light-state { display: flex; align-items: center; gap: 12px; }
.lamp-logo { width: 42px; height: 46px; position: relative; margin-right: 4px; }
.lamp-logo::before { content: ""; width: 23px; height: 25px; border: 2px solid #3d6b62; box-shadow: inset 0 0 0 3px #152923, 0 0 16px #7fc9974a; background: #a6edb4; position: absolute; left: 9px; top: 7px; clip-path: polygon(19% 0,81% 0,100% 20%,100% 80%,81% 100%,19% 100%,0 80%,0 20%); }
.lamp-logo::after { content: ""; width: 16px; height: 4px; background: #7ba18f; position: absolute; left: 13px; bottom: 6px; box-shadow: 0 3px 0 -1px #476e66; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 32px; font-weight: 850; letter-spacing: .17em; line-height: 1.06; }
.identity p { color: var(--dim); font-size: 12px; margin-top: 6px; letter-spacing: .10em; }
.toolbar { gap: 8px; }
.save-state { gap: 7px; font-size: 12px; color: var(--dim); margin-right: 8px; }
.save-state i, .light-state i, .map-title i { width: 6px; height: 6px; display: inline-block; background: var(--green); box-shadow: 0 0 8px #a6edb456; }
.small { padding: 8px 11px; border: 1px solid var(--line); color: var(--soft); background: #121922; font-size: 12px; }
.small:hover { color: var(--green); border-color: var(--green); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(258px, 297px); gap: 15px; align-items: start; }
.game-panel, .panel { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 14px 40px #05080965; }
.scene-header, .status-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 12px; }
.scene-header span:first-child { color: var(--green); }
.scene-header span:last-child { color: var(--dim); }
.viewport { position: relative; background: #0b1118; overflow: hidden; border-block: 1px solid #2d414a; }
.viewport::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 3px,#070b1210 3px 4px); z-index: 1; }
canvas { display: block; width: 100%; image-rendering: pixelated; }
#world { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.screen-alert, .prompt, .dialogue { z-index: 2; position: absolute; }
.screen-alert, .prompt { pointer-events: none; }
.screen-alert { top: 12px; left: 50%; transform: translateX(-50%); max-width: 94%; text-align: center; padding: 6px 10px; border: 1px solid #a77a4d; background: #241a15ee; color: var(--amber); font-size: 12px; }
.prompt { bottom: 13px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #0b1119eb; border: 1px solid #5b8478; padding: 5px 10px 5px 5px; display: flex; gap: 8px; align-items: center; color: var(--green); font-size: 13px; }
.prompt kbd { color: #152820; background: var(--green); border-color: var(--green); }
.dialogue { left: 11px; bottom: 53px; width: min(325px, calc(100% - 22px)); background: #0c121ce9; border: 1px solid #60695d; padding: 10px 13px; font-size: 13px; box-shadow: 0 3px 0 #0005; pointer-events: none; }
.dialogue span { color: var(--amber); font-size: 11px; }
.dialogue p { margin-top: 4px; line-height: 1.6; }
.status-bar { justify-content: flex-start; flex-wrap: wrap; gap: 19px; }
.meter { display: grid; grid-template-columns: auto clamp(32px, 7vw, 100px) 25px; align-items: center; gap: 7px; color: var(--soft); }
.meter div { height: 6px; background: #242d36; }
.meter i { width: 100%; height: 100%; background: var(--green); display: block; }
.meter.amber i { background: var(--amber); }
.meter b { font-weight: 500; font-variant-numeric: tabular-nums; }
.light-state { margin-left: auto; font-size: 11px; color: var(--dim); gap: 7px; }
.light-state i.dark { background: #70808a; box-shadow: none; }
.chapters { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.chapters span { padding: 11px 14px; color: var(--dim); font-size: 12px; border-bottom: 2px solid transparent; }
.chapters span.current { color: var(--green); background: #a6edb40b; border-color: var(--green); }
.mission, .map-card { padding: 16px; }
.folio { font-size: 11px; color: var(--green); letter-spacing: .10em; }
.mission h2 { font-size: clamp(20px, 1.9vw, 28px); margin: 8px 0 18px; letter-spacing: .02em; line-height: 1.23; }
.objective { padding: 11px 11px 12px; background: var(--well); border-left: 2px solid var(--amber); min-height: 105px; }
.objective > span { font-size: 10px; color: var(--amber); }
.objective h3 { font-size: 15px; margin: 5px 0; line-height: 1.4; }
.objective p, .map-card p, .field-note { font-size: 12px; color: var(--soft); line-height: 1.7; }
.mission-data { display: flex; gap: 11px; justify-content: space-between; margin-top: 14px; font-size: 11px; color: var(--dim); }
.mission-data b { font-size: 12px; font-weight: 550; color: var(--light); }
.map-card { border-top: 1px solid var(--line); }
.map-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.map-title h3 { font-size: 13px; }
.map-title span { font-size: 10px; color: var(--dim); }
.map-title i { margin-right: 5px; }
.map-card canvas { background: var(--well); border: 1px solid #27333d; }
.map-card p { margin-top: 8px; min-height: 38px; }
.field-note { padding: 11px 16px; border-top: 1px solid var(--line); color: var(--dim); }
.footer { padding: 13px 1px; font-size: 12px; color: var(--dim); }
.keyboard-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 9px 19px; }
.gesture-note { display: none; color: var(--soft); line-height: 1.55; }
kbd { font: inherit; font-size: 11px; display: inline-block; min-width: 19px; text-align: center; color: var(--soft); border: 1px solid #3a4552; background: #151c27; padding: 2px 4px; margin-right: 2px; }
dialog { max-width: min(560px, calc(100vw - 24px)); width: 100%; padding: 0; color: var(--light); border: 1px solid #587167; background: var(--panel); box-shadow: 0 25px 70px #000a; max-height: calc(100dvh - 22px); }
dialog::backdrop { background: #080f17a9; backdrop-filter: blur(3px); }
.dialog-inner { padding: 23px; }
.dialog-inner h2 { margin: 7px 0 9px; font-size: 24px; }
.dialog-inner > p:not(.folio) { color: var(--soft); line-height: 1.65; font-size: 13px; white-space: pre-line; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.actions button { background: var(--well); padding: 10px 12px; color: var(--light); text-align: left; border: 1px solid #40534e; font-size: 13px; }
.actions button:first-child { border-color: #8dcc9f; }
.actions button:hover:not(:disabled) { background: #20312d; color: var(--green); }
.actions button:disabled { color: var(--dim); cursor: default; }
.actions small { display: block; font-size: 11px; color: var(--dim); line-height: 1.5; margin-top: 4px; }
.rally-meter { position: relative; height: 11px; margin-top: 17px; background: #28343f; }
.rally-meter i { position: absolute; inset: 0 auto 0 58%; width: 19%; background: #76ae86; }
.rally-meter b { position: absolute; top: -2px; bottom: -2px; left: 0; width: 3px; background: var(--amber); }
@media (max-width: 860px) {
  .shell { padding: 17px; }
  .layout { grid-template-columns: minmax(0,1fr) 230px; gap: 10px; }
  .save-state { display: none; }
  .mission, .map-card { padding: 12px; }
}
@media (max-width: 640px) {
  .shell { padding: 10px; }
  .masthead { margin-bottom: 11px; }
  h1 { font-size: 23px; }
  .identity { gap: 5px; }
  .lamp-logo { transform: scale(.8); transform-origin: left center; margin-right: 0; width: 32px; }
  .layout { grid-template-columns: 1fr; }
  .mission h2 { margin-bottom: 9px; }
  .objective { min-height: 0; }
  .map-card { display: none; }
  .status-bar { padding: 8px; gap: 10px; }
  .scene-header { padding: 7px 8px; font-size: 10px; }
  .field-note { display: none; }
  .dialogue { bottom: 33px; padding: 5px 8px; font-size: 11px; max-width: 76%; }
  .prompt { bottom: 4px; font-size: 11px; padding-block: 2px; }
  .screen-alert { top: 5px; font-size: 10px; padding: 3px 5px; }
}
@media (hover: none) and (pointer: coarse), (max-width: 640px) {
  .keyboard-hint, .keyboard-controls { display: none; }
  .gesture-note { display: block; }
}
@media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
  .shell { padding: 8px; }
  .masthead { margin-bottom: 7px; }
  .layout { grid-template-columns: minmax(0, 1fr) minmax(155px, 27%); }
  .viewport canvas { height: clamp(100px, calc(100dvh - 138px), 320px); object-fit: contain; }
  .scene-header, .status-bar { padding: 5px 8px; }
  .map-card, .field-note { display: none; }
}
</style>

    <footer class="footer">

  </main>

<script>
"use strict";

const art = (() => {
  const colors = {
    black: "#111725", road: ["#343e45", "#354147", "#354149", "#313d45"],
    floor: ["#29343f", "#2c3842", "#303a43"], mud: ["#383b3b", "#393d3e", "#353b3d"],
    earth: ["#181f29","#19222b","#1c242d","#1a2128"], roof: "#344952", teal: "#579080"
  };
  function box(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
  }
  function rand(x, y, i = 0) {
    let value = Math.imul(x + i * 313, 1597334677) ^ Math.imul(y + 31, 3812015801);
    value = Math.imul(value ^ value >>> 16, 2246822519);
    return ((value ^ value >>> 13) >>> 0) / 4294967296;
  }
  function roadAt(map, x, y) {
    return map.areas.some(([l,t,r,b]) => x >= l && x < r && y >= t && y < b);
  }
  function pathLine(ctx, x1, y1, x2, y2, color, width = 1) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }
  function tree(ctx, x, y, n) {
    box(ctx,x+3,y+12,12,4,"#111a22");
    box(ctx,x+7,y+9,3,8,"#424344");
    box(ctx,x+4,y+1,10,12,"#202f31");
    box(ctx,x+2,y+5,14,7,"#263836");
    box(ctx,x+5,y+3,7,5,n > .6 ? "#35483d" : "#2b3b38");
    box(ctx,x+8,y+2,3,9,"#394b40");
    box(ctx,x+1,y+10,4,2,"#202c2e");
  }
  function crate(ctx, x, y, type = 0, scale = 1) {
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(scale,scale);
    box(ctx,-7,3,15,5,"#111821");
    box(ctx,-7,-5,14,10,type ? "#53715a" : "#956f49");
    box(ctx,-7,-7,14,3,type ? "#729366" : "#bf9266");
    box(ctx,-7,3,14,2,"#392f2c");
    box(ctx,-5,-6,2,10,"#c5ad79"); box(ctx,3,-6,2,10,"#665137");
    if (type) { box(ctx,-2,-8,4,3,"#a4ca86"); box(ctx,-1,-10,2,3,"#537f53"); }

  function building(ctx, [tx,ty,tw,th,kind]) {

      }
    }
    box(ctx,x,y+h-21,w,4,station?"#75948a":hospital?"#80786c":"#59616c");
    box(ctx,x+2,y+h-16,w-4,16,ruined?"#293039":"#384651");
    box(ctx,x+3,y+h-15,w-6,2,"#4a5761");
    for(let wx=x+8;wx<x+w-12;wx+=18){

      box(ctx,dx+4,y+h-10,14,9,"#304451");
      box(ctx,dx+10,y+h-10,2,9,"#19222b");
      if(hospital){box(ctx,x+w/2-15,y+14,30,22,"#3c4850");box(ctx,x+w/2-3,y+17,6,16,"#c78471");box(ctx,x+w/2-8,y+22,16,6,"#c78471");}
      if(power){box(ctx,x+w/2-9,y+17,18,18,"#242d36");box(ctx,x+w/2-2,y+19,4,12,"#c1a166");box(ctx,x+w/2-5,y+23,9,4,"#e7bf70");}
    }
    if(ruined){for(let j=0;j<9;j++){const xx=x+6+rand(tx+j,ty)*Math.max(6,w-12), yy=y+8+rand(tx,ty+j)*Math.max(5,h-31);box(ctx,xx,yy,4+(j%3)*3,3,"#1c2831");}}
  }
  function terrain(map, chapter) {
    const bg=document.createElement("canvas"); bg.width=WIDTH*TILE;bg.height=HEIGHT*TILE;
    const ctx=bg.getContext("2d");
    for(let y=0;y<HEIGHT;y++) for(let x=0;x<WIDTH;x++){
      const px=x*TILE, py=y*TILE, noise=rand(x,y);
      const water=chapter===2 && x>=27 && x<=51 && y>=11 && y<=18 && !roadAt(map,x+.5,y+.5);
      const onRoad=roadAt(map,x+.5,y+.5);
      const set=onRoad?(y>=18 && x>18 && x<45?colors.mud:colors.road):colors.earth;

        box(ctx,px+rand(x,y,3)*10,py+4,5,1,"#355561");

        }

        if(onRoad && !roadAt(map,x+.5,y+1.5))box(ctx,px,py+14,16,2,"#25353e");
        if(onRoad && noise>.83){box(ctx,px+4,py+5,5,1,"#242e37");box(ctx,px+8,py+6,1,3,"#242e37");}
        if(!onRoad && noise>.92){box(ctx,px+5,py+9,7,2,"#475043");box(ctx,px+7,py+6,2,5,"#536051");}

    }
    for(let x=3;x<65;x++) {
      if(x%3===0){box(ctx,x*16,15*16,10,2,"#77765d"); if(x>=19&&x<46)box(ctx,x*16,8.7*16,9,1,"#9b8a67");}
      if(x>=19&&x<45) {
        box(ctx,x*16,18.3*16,16,1,"#526653");
        box(ctx,x*16,21.75*16,16,1,"#536259");

    if(chapter===1) {
      for(let x=49;x<64;x++){
        box(ctx,x*16,11.1*16,16,1,"#93886a");box(ctx,x*16,16.9*16,16,1,"#93886a");

      }
      for(let x=53;x<=58;x+=2){box(ctx,x*16,20*16,20,11,"#526551");box(ctx,x*16+1,20*16+3,18,5,"#7f9061");}
    } else {
      for(let x=45;x<64;x++){
        for(const y of [8.5,11.8,16.4,20.2]) {
          box(ctx,x*16,y*16,16,2,"#829094");
          box(ctx,x*16,y*16+3,4,4,"#455765");
        }
      }
    }
    for(const b of map.buildings) building(ctx,b);
    for(let x=1;x<WIDTH-1;x++) for(let y=1;y<HEIGHT-1;y++){
      if(rand(x,y,6)<.925 || roadAt(map,x+.5,y+.5) || map.buildings.some(([a,b,w,h])=>x>=a-1&&x<=a+w&&y>=b-1&&y<=b+h))continue;
      tree(ctx,x*TILE,y*TILE,rand(x,y,7));
    }
    for(const [x,y,variant] of [[15,16,0],[17,12,0],[22,10,0],[40,20,0],[48,12,0],[57,18,1],[10,16,1],[53,10,0]]) crate(ctx,x*TILE,y*TILE,variant);
    return bg;
  }
  function person(ctx,x,y,look,step=0,flip=1) {
    ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(flip,1);
    box(ctx,-8,3,16,4,"#141d28");
    box(ctx,-5,-1+step,4,6,"#19232d");box(ctx,1,-1-step,4,6,"#19232d");
    box(ctx,-5,2+step,4,2,"#687473");box(ctx,1,2-step,4,2,"#687473");
    box(ctx,-7,-7,14,8,"#15222b");box(ctx,-5,-7,10,8,look.coat);box(ctx,-6,-5,3,6,look.trim);
    box(ctx,4,-5,3,6,look.coat);box(ctx,5,-2,2,2,look.skin);
    box(ctx,-5,-17,10,11,"#1a2229");box(ctx,-4,-15,8,8,look.skin);
    box(ctx,-5,-17,10,4,look.hair);box(ctx,-5,-14,2,4,look.hair);
    box(ctx,1,-12,1,2,"#303646");box(ctx,4,-13,1,2,"#303646");
    box(ctx,-3,-5,3,3,look.trim);ctx.restore();
  }
  const looks={
    player:{coat:"#cd864e",trim:"#e4c077",skin:"#d3a482",hair:"#524744"},
    sister:{coat:"#808e75",trim:"#b5ad79",skin:"#d2a08f",hair:"#5c4746"},
    engineer:{coat:"#567b88",trim:"#86bbb0",skin:"#b38d72",hair:"#425562"},
    child:{coat:"#9e8c61",trim:"#dbbd6c",skin:"#d1a181",hair:"#443b3f"},
    grower:{coat:"#68805c",trim:"#bfab69",skin:"#d5a77c",hair:"#574a46"}
  };
  function robot(ctx,e,t){
    const x=e.x*TILE,y=e.y*TILE;
    const boss=e.kind==="station"||e.kind==="bridge";
    ctx.save();ctx.translate(Math.round(x),Math.round(y));if(boss)ctx.scale(2.4,2.4);
    const anim=Math.floor(t*6)%2;
    const color=e.kind==="thief"?"#b18f67":e.kind==="jammer"?"#977b9d":"#8b9ba4";
    box(ctx,-10,2,20,5,"#15202a");
    box(ctx,-10,-4,5,9,"#283138");box(ctx,5,-4,5,9,"#283138");
    box(ctx,-10,-3+anim,5,2,"#52616a");box(ctx,5,-3+anim,5,2,"#52616a");
    box(ctx,-7,-11,14,13,"#344550");box(ctx,-6,-10,12,8,color);
    box(ctx,-6,-9,11,2,"#bac3bc");box(ctx,-5,-6,10,4,"#292d38");
    box(ctx,-2,-5,4,2,e.hurt>0?"#fff3c2":boss?"#efbf66":"#e28c79");
    if(e.kind==="thief"){box(ctx,-9,-8,3,5,"#d6ad7f");box(ctx,6,-8,3,5,"#d6ad7f");}
    if(e.kind==="jammer"){box(ctx,1,-15,1,5,"#c8a4ce");box(ctx,0,-16,3,2,"#c8a4ce");}
    if(boss){box(ctx,-10,-14,20,3,"#4e6769");box(ctx,-8,-14,3,2,"#e4b86b");box(ctx,5,-14,3,2,"#e4b86b");}
    ctx.restore();
  }
  function glow(ctx,x,y,r,tint){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,tint+"70");g.addColorStop(.45,tint+"24");g.addColorStop(1,tint+"00");
    ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  return {box,pathLine,terrain,person,robot,crate,glow,looks,roadAt};
})();

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("world");

const safe = (fn, otherwise) => { try { return fn(); } catch { return otherwise; } };

function opening() {
  return {
    ch: 1, phase: "hospital", x: 5, y: 14.5, hp: 100, stamina: 100, scrap: 0,

}
let state = load();
let checkpoint;
let runtime;

let soundContext;

}

  $("speaker").textContent = speaker;

  $("dialogue").hidden = false;
  dialogueUntil = now + seconds;
}
function beep(freq, duration = .09, type = "triangle", volume = .055) {
  if (!audioOn || !soundContext) return;
  const start = soundContext.currentTime;
  const osc = soundContext.createOscillator();
  const gain = soundContext.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq,start);
  osc.frequency.exponentialRampToValueAtTime(freq * .78, start+duration);
  gain.gain.setValueAtTime(volume,start);
  gain.gain.exponentialRampToValueAtTime(.001,start+duration);
  osc.connect(gain);gain.connect(soundContext.destination);
  osc.start(start);osc.stop(start+duration);
}
function newRuntime() {
  runtime = {
    enemies: [], spawn: 0, marks: {}, boss: null, bossTime: 0, bossSpawn: 0,

}

function closeMenu() { if(menu.open) menu.close(); clearControls(); rally=null; $("rally-meter").hidden=true; }
const returnChoice = {title:"返回现场"};

      {title:"医院优先 · 3 + 1",note:"医院照明，站台保留值守灯。明早在室内用保温箱接苗。",run:()=>commitPower("hospital")},
      {title:"邻区借电 · 3 + 2",note:state.flags.borrow?"借电已签字。次日有邻区帮工，灯廊少一段照明。":"先去站口左侧的邻区值班台，借 1 格当晚电力。",disabled:!state.flags.borrow,run:()=>commitPower("borrow")},
      {title:"修反射镜 · 夜间 3 + 1",note:state.flags.mirror?"镜面已装好。白天从日光育苗架接货。":"先去站台上方的屋顶零件点，安装反射镜。",disabled:!state.flags.mirror,run:()=>commitPower("mirror")},

}
function commitPower(choice) {
  if(state.phase !== "power") return;

function takeCargo(mode, ids) {
  if(!ids.length) return;
  state.carry = mode;
  state.held = mode === "hand" ? ids.slice(0,1) : ids;
  if(state.drop && ids === state.drop.ids) {
    const left=state.drop.ids.filter(id=>!state.held.includes(id));
    state.drop=left.length?{...state.drop,ids:left}:null;
  }
  if(state.phase==="collect")setPhase("transport");else save();

}

function splitCargo() {

function updateMovement(dt){
  const keyX=Number(keys.has("KeyD")||keys.has("ArrowRight"))-Number(keys.has("KeyA")||keys.has("ArrowLeft"));
  const keyY=Number(keys.has("KeyS")||keys.has("ArrowDown"))-Number(keys.has("KeyW")||keys.has("ArrowUp"));
  const keyLength=Math.hypot(keyX,keyY);
  const dx=keyLength?keyX/keyLength:touchInput.x;
  const dy=keyLength?keyY/keyLength:touchInput.y;
  const strength=keyLength?1:Math.hypot(dx,dy);
  runtime.walking=strength>0;
  if(dx)runtime.flip=Math.sign(dx);
  let speed=state.carry==="cart"?2.8+(state.specialty==="transport"?.2:0):state.carry==="hand"?3.4:4;
  const sprinting=touchInput.sprint||keys.has("ShiftLeft")||keys.has("ShiftRight");
  if(strength&&!state.carry&&sprinting&&state.stamina>0){
    speed=5.6;state.stamina=Math.max(0,state.stamina-10*dt*strength);runtime.lastSprint=runtime.elapsed;
  }
  if(strength){
    const nx=state.x+dx*speed*dt;
    const ny=state.y+dy*speed*dt;
    if(passable(nx,state.y))state.x=nx;
    if(passable(state.x,ny))state.y=ny;
  }
  if(runtime.elapsed-runtime.lastSprint>1&&isLit())state.stamina=Math.min(100,state.stamina+8*dt);
  let companion=state.crew==="hold"&&runtime.guard?runtime.guard:
    {x:state.x-.78*runtime.flip,y:state.y+.67};
  const distanceTo=distance(companion,{x:runtime.npcX,y:runtime.npcY});
  const speedNpc=distanceTo>6?7:4;
  const factor=Math.min(1,speedNpc*dt/Math.max(.001,distanceTo));
  runtime.npcX+=(companion.x-runtime.npcX)*factor;
  runtime.npcY+=(companion.y-runtime.npcY)*factor;
}
function passable(x,y){
  if(!art.roadAt(currentMap(),x,y))return false;
  if(state.carry==="cart"&&x>=20&&x<43&&y>=18)return false;
  if(state.ch===1&&x>=36&&x<37&&y>=18&&y<22&&!state.flags.gate)return false;
  if(state.ch===1&&state.phase!=="stationBoss"&&["hospital","workorder","scout","collect","transport"].includes(state.phase)&&x>53)return false;
  if(state.ch===1&&state.phase==="stationBoss"&&runtime.boss&&!bossExposed()&&!state.flags.lever&&x>=55.7&&x<56.4&&y>11.8&&y<16.1)return false;
  if(state.ch===2&&["collect","transport","defensePrep","defenseWave"].includes(state.phase)&&x>53.8)return false;
  return true;
}
function lamps(){
  const result=currentMap().lamps.filter(([x])=>!(state.ch===2&&state.allocation==="borrow"&&x===34));
  if(state.ch===2&&state.flags.pump)result.push([33.7,20,2.6]);
  if(state.ch===2)for(const [key,device] of Object.entries(state.towers))if(device.kind==="light"&&runtime.disabled<=0){const p=point(key);result.push([p.x,p.y,2.8]);}
  return result;
}
function isLit(){return lamps().some(([x,y,r])=>Math.hypot(state.x-x,state.y-y)<r);}
function triggerPatrols(){
  const once=(key,condition,group)=>{if(condition&&!runtime.marks[key]){runtime.marks[key]=true;enemyGroup(group);}};
  const ch=state.ch;

  }

    once("top",state.x>24&&state.x<38&&state.y<12,[["patrol",31,8],["patrol",34,10],["thief",38,9]]);
    once("bottom",state.x>24&&state.x<36&&state.y>=18,[["patrol",30,20],["jammer",35,20.5]]);

function updateBoss(dt){
  if(!runtime.boss)return;
  const e=runtime.boss;
  runtime.bossTime+=dt;e.hurt=Math.max(0,e.hurt-dt);
  const cycle=runtime.bossTime%7;
  let aim=bossLane();
  if(e.kind==="station")aim=14.2+(Math.floor(runtime.bossTime/7)%2===0?-1:1);
  e.y+=(aim-e.y)*Math.min(1,dt*(cycle<4.4?2.4:1));
  if(cycle>=3.4&&cycle<4.4){
    const hit=e.kind==="bridge"
      ?state.x>54&&Math.abs(state.y-bossLane())<.93
      :state.x>53&&state.x<61&&Math.abs(state.y-e.y)<.96;
    if(hit)hitPlayer(e.kind==="bridge"?16:13);
  }
  const cycleIndex=Math.floor(runtime.bossTime/7);
  if(cycleIndex>runtime.bossSpawn&&runtime.enemies.length<3){
    runtime.bossSpawn=cycleIndex;
    enemy(e.kind==="station"?"thief":"patrol",e.x + .7,e.y+.8);
  }
}
function updateEnemies(dt) {
  const defend=state.phase==="defenseWave";
  const manager=defend?point("console"):null;
  for(const e of runtime.enemies){
    e.hurt=Math.max(0,e.hurt-dt);e.cd=Math.max(0,e.cd-dt);
    const targetsCrate=e.kind==="thief"&&state.held.length>0;
    const target=defend&&manager?manager:targetsCrate?state.drop||state:state;
    const dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy);
    const slowed=runtime.disabled<=0&&Object.entries(state.towers).some(([key,value])=>value.kind==="slow"&&distance(e,point(key))<2.65);
    if(d>1.02 && e.ready<=0){
      const speed=ENEMIES[e.kind].speed*(slowed?.65:1);
      e.x+=dx/d*speed*dt;e.y+=dy/d*speed*dt;
    } else if(e.cd<=0){
      e.ready+=dt;
      const wind=e.kind==="jammer"?2:e.kind==="thief"?1.04:.8;
      if(e.ready>=wind){
        e.ready=0;e.cd=e.kind==="jammer"?6:1.55;
        if(distance(e,target)<1.68){
          if(defend) {
            if(e.kind==="jammer")runtime.disabled=3;
            runtime.cabinet=Math.max(0,runtime.cabinet-(e.kind==="jammer"?9:7));
          }
          else if(targetsCrate && state.ch===2){
            const id=state.held[0];
            state.quality[id]-=state.crew==="escort"?.5:1;
            if(state.quality[id]<=0){
              state.held=state.held.filter(box=>box!==id);

function updateAttacks(dt){

  }
  runtime.enemies=runtime.enemies.filter(e=>e.hp>0);
  runtime.effects=runtime.effects.map(e=>({...e,left:e.left-dt})).filter(e=>e.left>0);

function canvasTap(event){
  const bounds=canvas.getBoundingClientRect();
  const scale=Math.min(bounds.width/canvas.width,bounds.height/canvas.height);
  const left=bounds.left+(bounds.width-canvas.width*scale)/2;
  const top=bounds.top+(bounds.height-canvas.height*scale)/2;
  const px=(event.clientX-left)/scale;
  const py=(event.clientY-top)/scale;
  if(px<0||px>=canvas.width||py<0||py>=canvas.height)return;
  const tap={x:(px+Math.round(runtime.cameraX))/TILE,y:(py+Math.round(runtime.cameraY))/TILE};
  const targets=interactables().filter(item=>Math.abs(item.x-tap.x)<.95&&tap.y>=item.y-1.85&&tap.y<=item.y+.6);
  const target=targets.sort((a,b)=>distance(a,state)-distance(b,state))[0];
  if(target){
    if(distance(target,state)<1.58)use(target);
    else say("提示","走近后点按目标。",2);

  }
  if(state.held.length&&distance(tap,{x:state.x,y:state.y-.5})<1)use(null);

canvas.addEventListener("pointermove",event=>{
  if(event.pointerId!==touchInput.pointer)return;
  const x=event.clientX-touchInput.startX;
  const y=event.clientY-touchInput.startY;
  const length=Math.hypot(x,y);
  const deadZone=6;
  if(length>deadZone){
    touchInput.moved=true;
    clearTimeout(touchInput.timer);
  }
  const pull=clamp((length-deadZone)/22,0,1);
  touchInput.x=length===0?0:x/length*pull;
  touchInput.y=length===0?0:y/length*pull;
  touchInput.sprint=length>=52;
});
canvas.addEventListener("pointerup",event=>{
  if(event.pointerId!==touchInput.pointer)return;
  const tap=!touchInput.moved;
  releaseCanvasTouch();
  if(tap)canvasTap(event);
});
for(const eventName of ["pointercancel","lostpointercapture"]){
  canvas.addEventListener(eventName,event=>{if(event.pointerId===touchInput.pointer)releaseCanvasTouch();});
}
newRuntime();
save("本地存档");
syncHud();
if(state.phase==="hospital")say("护士","巡线员，林岚在医院入口等你。",5);
function frame(time){
  const dt=Math.min((time-last)/1000,.04);
  last=time;now+=dt;
  advance(dt);
  if(rally){
    lastRallyPosition=clamp((time-rally.start)/(1550-rally.score*95),0,1);
    $("rally-meter").lastElementChild.style.left=lastRallyPosition*100+"%";
    if(lastRallyPosition>=1){const score=rally.score;closeMenu();hitRally(score);}
  }
  render(dt);
  uiTime+=dt;
  if(uiTime>=.14){syncHud();uiTime=0;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
