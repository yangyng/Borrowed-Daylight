<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f13">
  <title>借昼 · Borrowed Daylight</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script defer src="world.js?v=2"></script>
  <script defer src="art.js?v=3"></script>
  <script defer src="story.js?v=2"></script>
  <script defer src="game.js?v=3"></script>
</head>
<body>
  <main class="shell">
    <div class="layout">
      <section class="game-panel" aria-label="游戏画面">
        <header class="scene-header">
          <div class="scene-meta"><span id="location">平原 · 中心医院</span><span id="day">战后第十八年 · 夜</span></div>
          <div class="toolbar">
            <span class="save-state"><i aria-hidden="true"></i><span id="save-label">本地存档</span></span>
            <button id="sound" class="small" aria-pressed="false">声音关</button>
            <button id="pause" class="small">暂停</button>
          </div>
        </header>
        <div class="viewport">
          <canvas id="world" width="480" height="288" aria-label="斜俯视像素游戏画面"></canvas>
          <div id="screen-alert" class="screen-alert" hidden></div>
          <div id="prompt" class="prompt" hidden><kbd class="keyboard-hint">E</kbd><span></span></div>
          <div id="dialogue" class="dialogue" hidden>
            <span id="speaker"></span><p id="speech"></p>
          </div>
        </div>
        <div class="status-bar">
          <div class="meter" role="group" aria-label="生命"><span>生命</span><div><i id="hp-bar"></i></div><b id="hp">100</b></div>
          <div class="meter amber" role="group" aria-label="体力"><span>体力</span><div><i id="stamina-bar"></i></div><b id="stamina">100</b></div>
          <div class="light-state"><i id="light-dot" aria-hidden="true"></i><span id="light-label">固定照明</span></div>
        </div>
      </section>
      <aside class="panel" aria-label="任务与地图">
        <div class="mission">
          <div class="objective"><span>当前任务</span><h2 id="goal-title" aria-live="polite">去病房见林岚</h2><p id="goal-text"></p></div>
          <div class="mission-data"><span>货物 <b id="freight">—</b></span><span>废料 <b id="scrap">0</b></span><span>小队 <b id="crew">1</b></span></div>
        </div>
        <div class="map-card">
          <div class="map-title"><h2>路线图</h2><span><i></i>当前位置</span></div>
          <canvas id="map" width="280" height="99" aria-label="路线小地图"></canvas>
          <p id="route-hint"></p>
        </div>
        <div class="field-note" id="field-note">固定照明能恢复体力。手提灯照亮脚下的路。</div>
      </aside>
    </div>
    <footer class="footer">
      <div class="keyboard-controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
        <span><kbd>Shift</kbd> 冲刺</span><span><kbd>E</kbd> 交互</span>
        <span><kbd>Space</kbd> 小队</span><span>武器自动攻击</span>
      </div>
      <p id="gesture-note" class="gesture-note">拖动画面移动，拖远可冲刺。点按近处标记交互，长按打开小队。</p>
    </footer>
  </main>
  <dialog id="story" aria-labelledby="story-title">
    <div class="story-inner">
      <p id="story-place" class="folio"></p>
      <h2 id="story-title"></h2>
      <div class="story-line" aria-live="polite"><span id="story-speaker"></span><p id="story-text"></p></div>
      <div class="story-actions">
        <button type="button" id="story-skip" class="small">跳过过场</button>
        <button type="button" id="story-next" class="small" autofocus>继续</button>
      </div>
    </div>
  </dialog>
  <dialog id="menu" aria-labelledby="modal-title">
    <div class="dialog-inner">
      <p class="folio" id="modal-label"></p>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="rally-meter" class="rally-meter" hidden aria-hidden="true"><i></i><b></b></div>
      <div id="modal-actions" class="actions"></div>
    </div>
  </dialog>
</body>
</html>
